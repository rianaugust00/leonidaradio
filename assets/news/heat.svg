<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3c"/><stop offset=".6" stop-color="#ff5f8f"/><stop offset="1" stop-color="#a23b8a"/></linearGradient></defs>
<rect width="800" height="450" fill="url(#s)"/>
<!-- sol enorme pulsando -->
<circle cx="400" cy="190" r="120" fill="#fff0b0"><animate attributeName="r" values="116;130;116" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="400" cy="190" r="170" fill="#fff0b0" opacity=".25"><animate attributeName="r" values="160;190;160" dur="3s" repeatCount="indefinite"/></circle>
<!-- termômetro -->
<g transform="translate(640 80)">
<rect x="0" y="0" width="26" height="180" rx="13" fill="#fff" opacity=".9"/>
<circle cx="13" cy="195" r="26" fill="#fff" opacity=".9"/>
<rect x="8" y="30" width="10" height="170" fill="#e5233a"><animate attributeName="y" values="90;30;90" dur="4s" repeatCount="indefinite"/><animate attributeName="height" values="110;170;110" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="13" cy="195" r="18" fill="#e5233a"/>
</g>
<!-- calçadão -->
<rect y="330" width="800" height="120" fill="#2a1745"/>
<!-- sorvete -->
<g transform="translate(130 210)">
<path d="M0 0 l36 0 l-18 90z" fill="#f5c089"/>
<circle cx="18" cy="-6" r="30" fill="#ff7aa8"/><circle cx="18" cy="-34" r="22" fill="#fdfdfd"/>
<g fill="#fdfdfd" opacity=".8"><path d="M30 20 q6 14 0 26" stroke="#fdfdfd" stroke-width="5" fill="none" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></path></g>
</g>
<!-- ondas de calor -->
<g fill="none" stroke="#fff" stroke-width="3" opacity=".35">
<path d="M0 320 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"><animateTransform attributeName="transform" type="translate" values="0 0;-100 0" dur="4s" repeatCount="indefinite"/></path>
<path d="M0 300 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"><animateTransform attributeName="transform" type="translate" values="-100 0;0 0" dur="5s" repeatCount="indefinite"/></path>
</g>
</svg>
