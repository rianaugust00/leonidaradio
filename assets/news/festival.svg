<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a1c"/><stop offset="1" stop-color="#3b1f5e"/></linearGradient>
<radialGradient id="b" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ff4f8b" stop-opacity=".7"/><stop offset="1" stop-color="#ff4f8b" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="450" fill="url(#s)"/>
<!-- feixes de luz -->
<g opacity=".55">
<path d="M200 60 L60 400 L200 400z" fill="url(#b)"><animateTransform attributeName="transform" type="rotate" values="-8 200 60; 8 200 60; -8 200 60" dur="4s" repeatCount="indefinite"/></path>
<path d="M400 60 L300 400 L500 400z" fill="#47e0ff" opacity=".25"><animateTransform attributeName="transform" type="rotate" values="6 400 60; -6 400 60; 6 400 60" dur="3.2s" repeatCount="indefinite"/></path>
<path d="M600 60 L500 400 L740 400z" fill="url(#b)"><animateTransform attributeName="transform" type="rotate" values="8 600 60; -8 600 60; 8 600 60" dur="4.6s" repeatCount="indefinite"/></path>
</g>
<!-- palco -->
<rect x="150" y="190" width="500" height="20" fill="#120d20"/>
<rect x="170" y="100" width="12" height="90" fill="#120d20"/><rect x="618" y="100" width="12" height="90" fill="#120d20"/>
<rect x="170" y="90" width="460" height="14" fill="#1f1f38"/>
<g fill="#ffdf80"><circle cx="220" cy="97" r="5"/><circle cx="300" cy="97" r="5"/><circle cx="400" cy="97" r="5"/><circle cx="500" cy="97" r="5"/><circle cx="580" cy="97" r="5"/></g>
<!-- plateia -->
<rect y="330" width="800" height="120" fill="#07060f"/>
<g fill="#07060f" stroke="#07060f">
<circle cx="60" cy="325" r="16"/><circle cx="130" cy="318" r="18"/><circle cx="200" cy="326" r="16"/><circle cx="290" cy="316" r="18"/><circle cx="370" cy="324" r="16"/><circle cx="450" cy="317" r="18"/><circle cx="530" cy="325" r="16"/><circle cx="610" cy="318" r="18"/><circle cx="690" cy="326" r="16"/><circle cx="755" cy="318" r="18"/>
</g>
<!-- mãos para cima -->
<g stroke="#07060f" stroke-width="7" stroke-linecap="round">
<path d="M130 310 v-34"><animate attributeName="d" values="M130 310 v-34;M130 310 v-48;M130 310 v-34" dur="1s" repeatCount="indefinite"/></path>
<path d="M290 308 v-40"><animate attributeName="d" values="M290 308 v-40;M290 308 v-26;M290 308 v-40" dur=".8s" repeatCount="indefinite"/></path>
<path d="M450 308 v-34"><animate attributeName="d" values="M450 308 v-34;M450 308 v-46;M450 308 v-34" dur="1.1s" repeatCount="indefinite"/></path>
<path d="M610 308 v-40"><animate attributeName="d" values="M610 308 v-40;M610 308 v-28;M610 308 v-40" dur=".9s" repeatCount="indefinite"/></path>
</g>
</svg>
